<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
    --violet:   #7c3aed;
    --violet2:  #a855f7;
    --gold:     #f59e0b;
    --bg-dark:  #0d0014;
    --glass:    rgba(255,255,255,0.06);
    --border:   rgba(255,255,255,0.12);
}

body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 20% 0%, #3b0764 0%, #0d0014 55%),
                radial-gradient(ellipse at 80% 100%, #1e0a3c 0%, transparent 60%);
    background-color: var(--bg-dark);
    font-family: 'Outfit', sans-serif;
    color: white;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(124,58,237,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,58,237,0.07) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
}

nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,0,20,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 40px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #fff 40%, var(--violet2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-decoration: none;
}

.nav-badge {
    background: linear-gradient(135deg, var(--violet), var(--violet2));
    color: white;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 6px 16px;
    border-radius: 100px;
    text-transform: uppercase;
}

.hero {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 80px 20px 60px;
}

.hero-label {
    display: inline-block;
    background: rgba(168,85,247,0.15);
    border: 1px solid rgba(168,85,247,0.35);
    color: var(--violet2);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 8px 22px;
    border-radius: 100px;
    margin-bottom: 30px;
}

.hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(60px, 10vw, 110px);
    letter-spacing: 6px;
    line-height: 1;
    margin-bottom: 20px;
}

.hero h1 span {
    background: linear-gradient(135deg, #fff 30%, var(--violet2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero p {
    color: rgba(255,255,255,0.45);
    font-size: 17px;
    font-weight: 300;
    max-width: 480px;
    margin: 0 auto 60px;
    line-height: 1.7;
}

.cards-grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 16px;
}

.cards-bottom {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 16px;
}

/* Botón Ver Clubes ocupa el ancho completo */
.cards-full {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 80px;
}

.btn-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 36px 20px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

.btn-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--violet), var(--violet2));
    opacity: 0;
    transition: opacity 0.3s ease;
}

.btn-card:hover::before { opacity: 1; }

.btn-card:hover {
    transform: translateY(-4px);
    border-color: var(--violet2);
    box-shadow: 0 20px 50px rgba(124,58,237,0.4);
    color: white;
}

/* Variante especial para Ver Clubes */
.btn-card-accent {
    flex-direction: row;
    padding: 24px 36px;
    gap: 16px;
    border-color: rgba(168,85,247,0.35);
    background: rgba(168,85,247,0.08);
}

.btn-card-accent .label { font-size: 17px; }

.btn-card .icon {
    position: relative;
    font-size: 32px;
    line-height: 1;
}

.btn-card .label {
    position: relative;
}

.btn-card .sublabel {
    position: relative;
    font-size: 12px;
    font-weight: 400;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0;
}
</style>
</head>
<body>

<nav>
    <a class="logo" href="#">⚽ Club Manager</a>
    <span class="nav-badge">Sistema de gestión</span>
</nav>

<section class="hero">
    <div>
        <span class="hero-label">Bienvenido</span>
        <h1><span>Club</span><br><span>Manager</span></h1>
        <p>Administra clubes, entrenadores, jugadores, competiciones y asociaciones desde un solo lugar.</p>
    </div>
</section>

<div class="cards-grid">
    <a href="/club" class="btn-card">
        <span class="icon">🏟</span>
        <span class="label">Crear Club</span>
    </a>
    <a href="/entrenador" class="btn-card">
        <span class="icon">👔</span>
        <span class="label">Crear Entrenador</span>
    </a>
    <a href="/jugador" class="btn-card">
        <span class="icon">⚽</span>
        <span class="label">Crear Jugador</span>
    </a>
</div>

<div class="cards-bottom">
    <a href="/competicion" class="btn-card">
        <span class="icon">🏆</span>
        <span class="label">Crear Competición</span>
    </a>
    <a href="/asociacion" class="btn-card">
        <span class="icon">🌎</span>
        <span class="label">Crear Asociación</span>
    </a>
</div>

<div class="cards-full">
    <a href="/listar" class="btn-card btn-card-accent">
        <span class="icon">📋</span>
        <div>
            <div class="label">Ver Clubes</div>
            <div class="sublabel">Lista general de clubes registrados</div>
        </div>
    </a>
</div>

</body>
</html>
