<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Competición</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root { --violet:#7c3aed; --violet2:#a855f7; --bg-dark:#0d0014; --glass:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.12); }
body {
    min-height:100vh;
    background: radial-gradient(ellipse at 20% 0%, #3b0764 0%, #0d0014 55%),
                radial-gradient(ellipse at 80% 100%, #1e0a3c 0%, transparent 60%);
    background-color: var(--bg-dark);
    font-family:'Outfit',sans-serif; color:white;
    display:flex; flex-direction:column;
}
body::before {
    content:''; position:fixed; inset:0;
    background-image: linear-gradient(rgba(124,58,237,0.07) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(124,58,237,0.07) 1px, transparent 1px);
    background-size:60px 60px; pointer-events:none; z-index:0;
}
nav { position:sticky; top:0; z-index:100; background:rgba(13,0,20,0.85); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 40px; height:68px; display:flex; align-items:center; justify-content:space-between; }
.logo { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:3px; background:linear-gradient(135deg,#fff 40%,var(--violet2));-webkit-background-clip: text; -webkit-text-fill-color:transparent; text-decoration:none; }
.back-btn { color:rgba(255,255,255,0.6); text-decoration:none; font-size:14px; font-weight:500; display:flex; align-items:center; gap:8px; transition:color 0.2s; }
.back-btn:hover { color:white; }
main { flex:1; position:relative; z-index:1; display:flex; align-items:flex-start; justify-content:center; padding:60px 20px; }
.card-box { width:100%; max-width:550px; background:var(--glass); border:1px solid var(--border); border-radius:24px; padding:48px; backdrop-filter:blur(16px); }
.page-title { font-family:'Bebas Neue',sans-serif; font-size:42px; letter-spacing:3px; margin-bottom:8px; }
.page-subtitle { color:rgba(255,255,255,0.45); font-size:14px; margin-bottom:40px; }
.section-label { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--violet2); margin-bottom:16px; margin-top:32px; display:flex; align-items:center; gap:10px; }
.section-label::after { content:''; flex:1; height:1px; background:var(--border); }
label { display:block; color:rgba(255,255,255,0.65); font-size:12px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:10px; }
.form-control {
    width:100%; background:rgba(255,255,255,0.08); border:1px solid var(--border);
    border-radius:12px; padding:14px 18px; color:white;
    font-family:'Outfit',sans-serif; font-size:15px;
    outline:none; transition:border-color 0.2s,box-shadow 0.2s;
}
.form-control:focus { border-color:var(--violet2); box-shadow:0 0 0 3px rgba(168,85,247,0.15); background:rgba(255,255,255,0.10); }
.form-control::placeholder { color:rgba(255,255,255,0.25); }
.btn-save { width:100%; background:linear-gradient(135deg,var(--violet),var(--violet2)); color:white; border:none; border-radius:12px; padding:16px; font-family:'Outfit',sans-serif; font-size:15px; font-weight:600; letter-spacing:0.5px; cursor:pointer; transition:transform 0.2s,box-shadow 0.2s; margin-top:24px; }
.btn-save:hover { transform:translateY(-2px); box-shadow:0 12px 40px rgba(124,58,237,0.5); }
.divider { height:1px; background:var(--border); margin:32px 0; }
</style>
</head>
<body>
<nav>
    <a class="logo" href="/">⚽ Club Manager</a>
    <a class="back-btn" href="/">← Volver</a>
</nav>
<main>
    <div class="card-box">
        <h1 class="page-title">Crear Competición</h1>
        <p class="page-subtitle">Registra una nueva competición en el sistema</p>
        <div class="divider"></div>

        <form action="/guardarCompeticion" method="post">

            <div class="section-label">Información</div>
            <div class="mb-4">
                <label>Nombre Competición</label>
                <input type="text" name="nombre" class="form-control" placeholder="Ej: Liga BetPlay" required>
            </div>

            <button class="btn-save">💾 Guardar Competición</button>
        </form>
    </div>
</main>
</body>
</html>
