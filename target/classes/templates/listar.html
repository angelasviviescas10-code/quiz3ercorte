<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Clubes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root { --violet:#7c3aed; --violet2:#a855f7; --bg-dark:#0d0014; --glass:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.12); }

body {
    min-height:100vh;
    background: radial-gradient(ellipse at 20% 0%, #3b0764 0%, #0d0014 55%),
                radial-gradient(ellipse at 80% 100%, #1e0a3c 0%, transparent 60%);
    background-color: var(--bg-dark);
    font-family:'Outfit',sans-serif; color:white;
    display:flex; flex-direction:column;
}
body::before {
    content:''; position:fixed; inset:0;
    background-image: linear-gradient(rgba(124,58,237,0.07) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(124,58,237,0.07) 1px, transparent 1px);
    background-size:60px 60px; pointer-events:none; z-index:0;
}

/* NAV */
nav {
    position:sticky; top:0; z-index:100;
    background:rgba(13,0,20,0.85); backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    padding:0 40px; height:68px;
    display:flex; align-items:center; justify-content:space-between;
}
.logo {
    font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:3px;
    background:linear-gradient(135deg,#fff 40%,var(--violet2));
    -webkit-text-fill-color:transparent;
    text-decoration:none;
}
.btn-nuevo {
    background:linear-gradient(135deg,var(--violet),var(--violet2));
    color:white; border:none; border-radius:10px;
    padding:10px 20px; font-family:'Outfit',sans-serif;
    font-size:13px; font-weight:600; letter-spacing:0.5px;
    cursor:pointer; text-decoration:none;
    transition:transform 0.2s, box-shadow 0.2s;
    display:flex; align-items:center; gap:6px;
}
.btn-nuevo:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(124,58,237,0.5); color:white; }

/* MAIN */
main { flex:1; position:relative; z-index:1; padding:60px 40px; }

.page-header { margin-bottom:40px; }
.page-title { font-family:'Bebas Neue',sans-serif; font-size:48px; letter-spacing:3px; margin-bottom:6px; }
.page-subtitle { color:rgba(255,255,255,0.4); font-size:14px; }

/* TABLE CARD */
.table-card {
    background:var(--glass); border:1px solid var(--border);
    border-radius:24px; padding:32px;
    backdrop-filter:blur(16px); overflow:hidden;
}

/* TABLE */
.table-responsive { border-radius:16px; overflow:hidden; }
table { width:100%; border-collapse:collapse; }

thead tr {
    background:linear-gradient(135deg, rgba(124,58,237,0.6), rgba(168,85,247,0.4));
    border-bottom:1px solid var(--border);
}
thead th {
    padding:16px 20px; font-size:11px; font-weight:700;
    letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.7);
    text-align:center; white-space:nowrap;
}

tbody tr {
    border-bottom:1px solid var(--border);
    transition:background 0.2s;
}
tbody tr:last-child { border-bottom:none; }
tbody tr:hover { background:rgba(255,255,255,0.04); }

tbody td {
    padding:18px 20px; text-align:center;
    vertical-align:middle; font-size:14px;
    color:rgba(255,255,255,0.85);
}

.cell-id {
    font-family:'Bebas Neue',sans-serif; font-size:20px;
    color:rgba(255,255,255,0.3); letter-spacing:1px;
}
.cell-club {
    font-weight:700; font-size:15px; color:white;
}

.badge-pill {
    display:inline-block; margin:3px;
    background:rgba(168,85,247,0.2); border:1px solid rgba(168,85,247,0.4);
    color:var(--violet2); padding:5px 14px;
    border-radius:100px; font-size:12px; font-weight:600;
    white-space:nowrap;
}

/* EMPTY STATE */
.empty-state {
    text-align:center; padding:60px 20px; color:rgba(255,255,255,0.25);
}
.empty-state .icon { font-size:48px; margin-bottom:16px; }
.empty-state p { font-size:14px; }
</style>
</head>
<body>

<nav>
    <a class="logo" href="/">⚽ Club Manager</a>
    <a class="btn-nuevo" href="/">➕ Nuevo Registro</a>
</nav>

<main>
    <div class="page-header">
        <h1 class="page-title">📋 Lista General de Clubes</h1>
        <p class="page-subtitle">Visualiza toda la información registrada del sistema</p>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Club</th>
                        <th>Entrenador</th>
                        <th>Jugadores</th>
                        <th>Competiciones</th>
                        <th>Asociación</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="club : ${listaClubes}">

                        <td class="cell-id" th:text="${club.id}"></td>

                        <td class="cell-club" th:text="${club.nombre}"></td>

                        <td>
                            <span class="badge-pill">
                                <span th:text="${club.entrenador.nombre}"></span>
                                <span th:text="${club.entrenador.apellido}"></span>
                            </span>
                        </td>

                        <td>
                            <div th:each="jugador : ${club.jugadores}">
                                <span class="badge-pill">
                                    <span th:text="${jugador.nombre}"></span>
                                    <span th:text="${jugador.apellido}"></span>
                                </span>
                            </div>
                        </td>

                        <td>
                            <div th:each="comp : ${club.competiciones}">
                                <span class="badge-pill" th:text="${comp.nombre}"></span>
                            </div>
                        </td>

                        <td>
                            <span class="badge-pill" th:text="${club.asociaciones.nombre}"></span>
                        </td>

                    </tr>

                    <!-- Empty state si no hay datos -->
                    <tr th:if="${#lists.isEmpty(listaClubes)}">
                        <td colspan="6">
                            <div class="empty-state">
                                <div class="icon">🏟️</div>
                                <p>No hay clubes registrados aún</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
